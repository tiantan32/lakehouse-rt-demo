resources:
  apps:
    lakehouse_rt_demo:
      name: lakehouse-rt-demo
      description: "Lakehouse RT Demo: DBSQL Serverless vs Lakehouse//RT, head to head and under scaled load."
      source_code_path: ../src/app
      # LARGE: the scaled-load driver runs inside the app and offers up to
      # 1,200 q/s from one asyncio loop.
      compute_size: LARGE

      resources:
        - name: dbsql_warehouse
          description: DBSQL Serverless warehouse, the comparison engine.
          sql_warehouse:
            id: ${var.dbsql_warehouse_id}
            permission: CAN_USE
        - name: rt_warehouse
          description: Lakehouse//RT warehouse. Read path only.
          sql_warehouse:
            id: ${var.rt_warehouse_id}
            permission: CAN_USE

      # Replaces app.yaml, so catalog and schema come from bundle variables.
      config:
        # The Python supervisor starts Streamlit on DATABRICKS_APP_PORT, runs
        # the warehouse watchdog and forwards shutdown signals.
        command: ["python", "warehouse_keeper.py", "--serve"]
        env:
          # The proxy origin (*.databricksapps.com) differs from the workspace
          # origin, which trips Streamlit's CORS and XSRF checks.
          - name: STREAMLIT_SERVER_ENABLE_CORS
            value: "false"
          - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
            value: "false"
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: "false"
          - name: DBSQL_WAREHOUSE_ID
            value_from: dbsql_warehouse
          - name: RT_WAREHOUSE_ID
            value_from: rt_warehouse
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          # Warehouse watchdog (warehouse_keeper.py). Nothing runs at boot: the
          # warehouses start on Pre-warm or on a measurement, stay warm while
          # the demo is used (a touch every KEEPALIVE seconds), and are stopped
          # after IDLE_STOP minutes without a click, unless someone else ran a
          # query on them in that window.
          - name: WAREHOUSE_IDLE_STOP_MINUTES
            value: "20"
          - name: WAREHOUSE_KEEPALIVE_SECONDS
            value: "180"
          # Scaled-load refresh. 10 s: 1,000 users offer 400 q/s.
          - name: RT_SCALE_REFRESH_S
            value: "10"
