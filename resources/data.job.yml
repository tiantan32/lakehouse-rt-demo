resources:
  jobs:
    generate_data:
      name: "[lakehouse-rt-demo] generate synthetic gold tables"
      tags:
        demo: lakehouse-rt-demo
      tasks:
        - task_key: generate_tables
          spark_python_task:
            python_file: ../src/data/generate_tables.py
            parameters:
              - ${var.catalog}
              - ${var.schema}
              - ${var.n_disputes}
              - "40000"     # merchants; must match demo_config.MERCHANT_COUNT
              - "400"       # days of filings, ending on the run date
              # Grants the app's service principal read access to the schema.
              - ${resources.apps.lakehouse_rt_demo.service_principal_client_id}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
